name = "trakt"
main = "worker.js"
compatibility_date = "2026-01-01"

# 静态资源（public/ 目录）
[assets]
directory = "./public"
binding = "ASSETS"

# 数据存储：Cloudflare D1（变量名 DB，库名 Trakt）
# database_id 留空时由 GitHub Actions 或 scripts/deploy-cf.mjs 自动填入
[[d1_databases]]
binding = "DB"
database_name = "Trakt"
database_id = "REPLACE_WITH_YOUR_D1_ID"

[vars]
COOKIE_SECURE = "true"
TMDB_LANG = "zh-CN"
# 可选：覆盖默认值
# TRAKT_API_BASE = "https://apiz.trakt.tv"
# TRAKT_AUTH_BASE = "https://auth.trakt.tv"

# WebDAV 自动备份排程：cron 每小时触发一次，是否真的备份由设置页的计划（含分钟）决定。
# 注意：免费账户的 Cron Triggers 上限是 5 个（整个账户所有 Worker 合计），用满后
# wrangler 会报 "Trigger configuration ... only partially updated" 并让部署失败——
# 那种情况下脚本其实已上线，只是 cron 没设上：去别的 Worker 删掉多余的 cron 再重跑即可。
[triggers]
crons = ["0 * * * *"]
