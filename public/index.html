<!doctype html>

<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="color-scheme" content="dark light" />
<title>Trakt Manager · 数据管理</title>
<script>
/* 首帧主题：在样式解析前写入 data-theme，避免浅色用户看到深色闪一下 */
(function () {
  try {
    var m = localStorage.getItem('tm_theme') || 'auto';
    if (m === 'auto') m = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
    document.documentElement.dataset.theme = m === 'light' ? 'light' : 'dark';
  } catch (e) {
    document.documentElement.dataset.theme = 'dark';
  }
})();
</script>
