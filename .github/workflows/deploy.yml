name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 检查仓库密钥
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::缺少 Secret CLOUDFLARE_API_TOKEN（需 Workers Scripts:Edit + D1:Edit）"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少 Secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 确保 D1 数据库 Trakt 存在（REST API，不依赖 wrangler 安装）
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          ACCT="${CLOUDFLARE_ACCOUNT_ID}"

          ID=$(curl -sS -H "$AUTH" "$API/accounts/$ACCT/d1/database?name=Trakt" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const a=j.result||[];const hit=a.find(x=>String(x.name).toLowerCase()==='trakt');process.stdout.write(hit?hit.uuid:'')})")

          if [ -z "$ID" ]; then
            echo "未找到 Trakt，创建中..."
            ID=$(curl -sS -X POST -H "$AUTH" -H 'content-type: application/json' \
              -d '{"name":"Trakt"}' "$API/accounts/$ACCT/d1/database" \
              | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success){console.error(JSON.stringify(j.errors));process.exit(1)}process.stdout.write(j.result.uuid)})")
            echo "已创建 D1：$ID"
          else
            echo "复用已有 D1：$ID"
          fi

          sed -i "s|database_id = \"[^\"]*\"|database_id = \"$ID\"|" wrangler.toml
          echo "✓ 已写入 wrangler.toml"
          grep -A2 'd1_databases' wrangler.toml

      - name: 应用表结构
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: d1 execute Trakt --file=./schema.sql --remote -y

      - name: 部署 Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4'
          command: deploy

      - name: 部署结果
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 部署完成"
          else
            echo "💥 部署失败，查看上面的 wrangler 输出"
          fi
