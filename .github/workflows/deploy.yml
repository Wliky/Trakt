name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 检查仓库密钥
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_API_TOKEN（需 Workers Scripts:Edit + D1:Edit 权限）"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "::error::缺少仓库 Secret CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi

      - name: 确保 D1 数据库 Trakt 存在
        run: node scripts/ensure-d1.mjs

      - name: 应用表结构
        run: npx --yes wrangler@latest d1 execute Trakt --file=./schema.sql --remote -y

      - name: 部署 Worker
        run: npx --yes wrangler@latest deploy
